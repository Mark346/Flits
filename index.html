}

/* ===== WAAR OF NIET WAAR ===== */
let TF=null;
function startTF(vid,did){
  const v=vak(vid),d=deck(v,did);
  const items=limit(shuffle(d.cards)).map(c=>{const it={c,v,d,dir:pickDir()},x=qa(it);
    const others=[...new Set(quizPool(v,d).filter(o=>o.id!==c.id).map(o=>it.dir==="fb"?o.b:o.f).filter(t=>t!==x.a))];
    const truth=!others.length||Math.random()<.5;return{...it,truth,shown:truth?x.a:shuffle(others)[0]}});
  TF={vid,did,items,i:0,g:0,streak:0,best:0};tfView();
}
function tfView(){
  if(TF.i>=TF.items.length)return tfEnd();
  const it=TF.items[TF.i],x=qa(it);
  app.innerHTML=`<div class="topbar"><button class="x" onclick="backToDeck('${TF.vid}','${TF.did}')">✕ Stoppen</button><span class="muted">${TF.i+1}/${TF.items.length} · 🔥 ${TF.streak}</span></div>
  <div class="pbar"><i style="width:${100*TF.i/TF.items.length}%"></i></div>
  <h2 style="margin-top:6px">⚖️ Klopt dit?</h2>
  <div class="qcard" id="tfc"><div class="w">${esc(x.q)}</div><div class="muted" style="margin:10px 0;font-size:20px">↓</div><div class="w" style="color:#9cc0ff">${esc(it.shown)}</div></div>
  <div class="tfbtns" id="tfb"><button style="background:#22a35a" onclick="tfA(true)">✅ Waar</button><button style="background:#d64545" onclick="tfA(false)">❌ Niet waar</button></div><div id="fbk"></div>`;
}
function tfA(ans){
  const it=TF.items[TF.i],ok=ans===it.truth,x=qa(it);
  $("tfb").style.pointerEvents="none";$("tfc").classList.add(ok?"flash-good":"flash-bad");
  if(ok){TF.g++;TF.streak++;TF.best=Math.max(TF.best,TF.streak);S.xp+=5;setTimeout(()=>{TF.i++;tfView()},550)}
  else{TF.streak=0;$("fbk").innerHTML=`<div class="fb bad"><b>❌ Helaas</b><p style="margin:6px 0 0">${esc(x.q)} → <b>${esc(x.a)}</b></p></div><button class="btn" onclick="TF.i++;tfView()">Volgende</button>`}
}
function tfEnd(){
  markDay();save();
  app.innerHTML=`<div class="card center" style="margin-top:30px"><div class="muted">Goed</div><div class="big">${TF.g}/${TF.items.length}</div><h3>Langste reeks: 🔥 ${TF.best}</h3></div>
  <button class="btn" onclick="startTF('${TF.vid}','${TF.did}')">Nog een keer</button><button class="btn alt" onclick="backToDeck('${TF.vid}','${TF.did}')">Klaar</button>`;
}

/* ===== HUSSELEN ===== */
let SC=null;
function clean(s){return s.replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim()}
function startScr(vid,did){
  const v=vak(vid),d=deck(v,did);
  const items=limit(shuffle(d.cards.map(c=>({c,v,d,dir:pickDir()})).filter(it=>{const a=clean(qa(it).a);return a.length>=2&&a.length<=22})));
  if(!items.length){alert("Husselen werkt met korte antwoorden (tot 22 tekens). Deze set heeft alleen lange antwoorden.");return}
  SC={vid,did,items,i:0,g:0};scrSetup();
}
function scrSetup(){
  if(SC.i>=SC.items.length)return scrEnd();
  const t=clean(qa(SC.items[SC.i]).a);SC.target=t;SC.done=false;
  SC.slots=[...t].map(ch=>ch===" "?{sp:true}:{p:null});
  SC.pool=shuffle([...t].filter(ch=>ch!==" ").map(ch=>({ch,used:false})));
  scrView();
}
function scrView(){
  const x=qa(SC.items[SC.i]);
  app.innerHTML=`<div class="topbar"><button class="x" onclick="backToDeck('${SC.vid}','${SC.did}')">✕ Stoppen</button><span class="muted">${SC.i+1}/${SC.items.length}</span></div>
  <div class="pbar"><i style="width:${100*SC.i/SC.items.length}%"></i></div>
  <h2 style="margin-top:6px">🔤 Zet de letters op volgorde</h2>
  <div class="qcard"><div class="muted">${x.ql}</div>${im(x.qi,"qimg")}<div class="w">${esc(x.q)}</div></div>
  <div class="slots">${SC.slots.map((s,i)=>s.sp?`<div class="slot sp"></div>`:`<div class="slot ${s.p!==null?"f":""}" onclick="scrBack(${i})">${s.p!==null?esc(SC.pool[s.p].ch):""}</div>`).join("")}</div>
  <div class="letters">${SC.pool.map((p,i)=>`<button class="letter ${p.used?"used":""}" onclick="scrPut(${i})">${esc(p.ch)}</button>`).join("")}</div>
  <div id="fbk">${SC.done?"":`<div class="grid2"><button class="btn alt" onclick="scrHint()">💡 Hint</button><button class="btn alt" onclick="scrFinish(false,true)">Overslaan</button></div>`}</div>`;
}
function scrPut(i){if(SC.done||SC.pool[i].used)return;const s=SC.slots.findIndex(x=>!x.sp&&x.p===null);if(s<0)return;SC.slots[s].p=i;SC.pool[i].used=true;scrCheck()}
function scrBack(i){if(SC.done)return;const s=SC.slots[i];if(s.p===null)return;SC.pool[s.p].used=false;s.p=null;scrView()}
function scrHint(){
  const s=SC.slots.findIndex(x=>!x.sp&&x.p===null);if(s<0)return;
  // eerst foute letters vóór deze plek terugzetten
  for(let k=0;k<s;k++){const sl=SC.slots[k];if(!sl.sp&&sl.p!==null&&SC.pool[sl.p].ch.toLowerCase()!==SC.target[k].toLowerCase()){SC.pool[sl.p].used=false;sl.p=null;return scrView()}}
  const need=SC.target[s].toLowerCase(),pi=SC.pool.findIndex(p=>!p.used&&p.ch.toLowerCase()===need);if(pi>=0)scrPut(pi);
}
function scrCheck(){
  if(SC.slots.some(x=>!x.sp&&x.p===null))return scrView();
  const built=SC.slots.map(x=>x.sp?" ":SC.pool[x.p].ch).join("");
  scrFinish(built.toLowerCase()===SC.target.toLowerCase());
}
function scrFinish(ok,skip){
  SC.done=true;scrView();if(ok){SC.g++;S.xp+=10}
  $("fbk").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"✅ Goed!":skip?"Overgeslagen":"❌ Niet helemaal"}</b>${ok?"":`<p style="margin:6px 0 0">Het antwoord is: <b>${esc(SC.target)}</b></p>`}</div><button class="btn" onclick="SC.i++;scrSetup()">Volgende</button>`;
}
function scrEnd(){markDay();save();
  app.innerHTML=`<div class="card center" style="margin-top:30px"><div class="muted">Goed</div><div class="big">${SC.g}/${SC.items.length}</div><h3>${SC.g===SC.items.length?"Alles goed! 🏆":"Lekker bezig! 👍"}</h3></div>
  <button class="btn" onclick="startScr('${SC.vid}','${SC.did}')">Nog een keer</button><button class="btn alt" onclick="backToDeck('${SC.vid}','${SC.did}')">Klaar</button>`;
}

/* ===== SNELRACE ===== */
let SP=null;
function startSpeed(vid,did){
  SP={vid,did,end:Date.now()+60000,score:0,wrong:0};
  app.innerHTML=`<div class="topbar"><button class="x" onclick="backToDeck('${vid}','${did}')">✕ Stoppen</button></div>
  <h1>⏱️ Snelrace</h1><div class="card"><p>Je hebt <b>60 seconden</b>. Beantwoord zoveel mogelijk meerkeuzevragen goed.</p><p class="muted">Een fout kost je 2 seconden.</p></div>
  <button class="btn" onclick="SP.end=Date.now()+60000;spNext();window._tick=setInterval(spTick,200)">Start!</button>`;
}
function spTick(){const left=SP.end-Date.now();if(left<=0){clearInterval(window._tick);return spEnd()}const b=$("spt");if(b)b.style.width=(100*left/60000)+"%";const s=$("sps");if(s)s.textContent=Math.ceil(left/1000)+"s"}
function spNext(){
  const v=vak(SP.vid),d=deck(v,SP.did),c=d.cards[Math.floor(Math.random()*d.cards.length)];
  SP.it={c,v,d,dir:pickDir()};SP.opts=optsFor(SP.it);const x=qa(SP.it);
  app.innerHTML=`<div class="row between"><b style="font-size:22px">⭐ ${SP.score}</b><span class="muted" id="sps"></span></div>
  <div class="timer"><i id="spt" style="width:${100*(SP.end-Date.now())/60000}%"></i></div>
  <div class="qcard" id="spc"><div class="w">${esc(x.q)}</div></div>
  ${SP.opts.map((o,i)=>`<button class="opt" onclick="spA(${i},this)">${esc(o)}</button>`).join("")}`;
  spTick();
}
function spA(i,el){
  if(SP.lock)return;SP.lock=true;const ok=SP.opts[i]===qa(SP.it).a;
  el.classList.add(ok?"good":"bad");if(ok)SP.score++;else{SP.wrong++;SP.end-=2000}
  setTimeout(()=>{SP.lock=false;if(SP.end>Date.now())spNext()},ok?180:450);
}
function spEnd(){
  const d=deck(vak(SP.vid),SP.did),rec=!d.bestSpeed||SP.score>d.bestSpeed;if(rec)d.bestSpeed=SP.score;S.xp+=SP.score*5;markDay();save();
  app.innerHTML=`<div class="card center" style="margin-top:30px"><div class="muted">Score</div><div class="big">${SP.score}</div>
  <h3>${rec?"🏆 Nieuw record!":"Tijd is op! ⏱️"}</h3><p class="muted">${SP.wrong} fout · record ${d.bestSpeed}</p></div>
  <button class="btn" onclick="startSpeed('${SP.vid}','${SP.did}')">Nog een keer</button><button class="btn alt" onclick="backToDeck('${SP.vid}','${SP.did}')">Klaar</button>`;
}

/* ===== OEFENTOETS ===== */
let T=null;
function startToets(vid,did){
  const v=vak(vid),d=deck(v,did),canQ=quizPool(v,d).length>=4;
  const items=(S.count?shuffle(d.cards).slice(0,S.count):shuffle(d.cards)).map(c=>{const it={c,v,d,dir:pickDir()};return{...it,opts:canQ&&Math.random()<.6?optsFor(it):null,ans:null,ok:false}});
  T={vid,did,items,i:0};
  app.innerHTML=`<div class="topbar"><button class="x" onclick="backToDeck('${vid}','${did}')">‹ Terug</button></div>
  <h1>📝 Oefentoets</h1><div class="card"><p><b>${items.length} vragen</b> uit ‘${esc(d.name)}’, door elkaar meerkeuze en open vragen.</p>
  <p class="muted">Je ziet pas aan het eind wat goed was en je krijgt een cijfer. Net als een echte toets.</p></div>
  <button class="btn" onclick="toetsQ()">Begin</button>`;
}
function toetsQ(){
  if(T.i>=T.items.length)return toetsEnd();
  const it=T.items[T.i],x=qa(it);
  app.innerHTML=`<div class="topbar"><button class="x" onclick="if(confirm('Toets stoppen?'))backToDeck('${T.vid}','${T.did}')">✕ Stoppen</button><span class="muted">Vraag ${T.i+1} van ${T.items.length}</span></div>
  <div class="pbar"><i style="width:${100*T.i/T.items.length}%"></i></div>
  <div class="qcard"><div class="muted">${x.ql}</div>${im(x.qi,"qimg")}<div class="w">${esc(x.q)}</div></div>
  ${it.opts?it.opts.map((o,i)=>`<button class="opt" onclick="toetsA(${i})">${esc(o)}</button>`).join(""):
  `<input id="ta" placeholder="Typ het antwoord…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')toetsA()"><button class="btn" onclick="toetsA()">Volgende</button>`}`;
  if(!it.opts)setTimeout(()=>$("ta")&&$("ta").focus(),50);
}
function toetsA(i){
  const it=T.items[T.i],x=qa(it);
  if(it.opts){it.ans=it.opts[i];it.ok=it.ans===x.a}else{const val=$("ta").value;it.ans=val.trim()||"(leeg)";it.ok=isRight(val,x.a)}
  T.i++;window.scrollTo(0,0);toetsQ();
}
function toetsEnd(){
  const n=T.items.length,g=T.items.filter(x=>x.ok).length,t=dayNum(),c=cijfer(g,n);
  T.items.forEach(it=>{const k=it.c;k.seen++;if(it.ok){k.box=Math.min(6,k.box+1);k.due=t+INT[k.box];k.right++;S.xp+=10}else{k.box=0;k.due=t}});
  const d=deck(vak(T.vid),T.did);d.toetsen=(d.toetsen||[]).concat([c]).slice(-10);markDay();save();
  const wrong=T.items.filter(x=>!x.ok);
  app.innerHTML=`<div class="card center" style="margin-top:20px"><div class="muted">Je cijfer</div>
  <div class="big" style="color:${c>=5.5?"var(--good)":"var(--bad)"}">${c.toFixed(1)}</div>
  <h3>${c>=8?"Top! 🏆":c>=5.5?"Voldoende! 👍":"Nog even oefenen 🔁"}</h3><p class="muted">${g} van de ${n} goed${d.toetsen.length>1?` · vorige keer ${d.toetsen[d.toetsen.length-2].toFixed(1)}`:""}</p></div>
  ${wrong.length?`<h2>Dit ging fout</h2><div class="card" style="padding:6px 14px">${wrong.map(it=>{const x=qa(it);return`<div class="kaart" style="flex-direction:column;gap:2px"><b>${esc(x.q)}</b><span style="color:#ff9b9b">✗ ${esc(it.ans)}</span><span style="color:#7ee6a8">✓ ${esc(x.a)}</span></div>`}).join("")}</div>
  <button class="btn" onclick="S.which='due';startStudy('flash',{scope:'deck',vid:'${T.vid}',did:'${T.did}'})">Oefen de foute kaarten</button>`:""}
  <button class="btn alt" onclick="backToDeck('${T.vid}','${T.did}')">Klaar</button>`;
}

/* ===== LEESLIJST ===== */
let HIDE=false;
function leesLijst(vid,did){
  const d=deck(vak(vid),did);
  app.innerHTML=`<div class="topbar"><button class="x" onclick="backToDeck('${vid}','${did}')">‹ Terug</button></div>
  <h1>👀 Leeslijst</h1><p class="muted">Lees alles rustig door. Zet ‘Verberg antwoorden’ aan en tik op een regel om jezelf te overhoren.</p>
  <div class="seg"><button class="${HIDE?"":"on"}" onclick="HIDE=false;leesLijst('${vid}','${did}')">Alles zien</button><button class="${HIDE?"on":""}" onclick="HIDE=true;leesLijst('${vid}','${did}')">Verberg antwoorden</button></div>
  <div class="card" style="padding:6px 14px">${d.cards.map(c=>`<div class="kaart" onclick="this.querySelector('.b').style.filter='none'">${c.img?`<img class="thumb" src="${c.img}">`:""}<div class="f">${esc(c.f)}</div><div class="b" style="${HIDE?"filter:blur(7px);cursor:pointer":""}">${esc(c.b)}</div></div>`).join("")}</div>`;
}

/* ===== KAARTENMAKER ===== */
let MK={img:null};
function vMaker(){
  const v=vak(R.vid),d=deck(v,R.did);if(!d)return go({v:"home"});
  MK={img:null,side:"f"};
  const recent=d.cards.slice(-5).reverse();
  app.innerHTML=`<div class="topbar"><button class="x" onclick="backToDeck('${v.id}','${d.id}')">‹ Klaar</button><span class="muted">${v.ico} ${esc(d.name)}</span></div>
  <h2 style="margin-top:4px">✍️ Kaarten maken</h2><p class="muted" id="mkcount">${d.cards.length} kaart${d.cards.length===1?"":"en"} in deze set</p>
  <div class="stage"><div class="flip enter" id="mk"><div class="in">
    <div class="side front" style="background:linear-gradient(145deg,${v.color},${shade(v.color)})"><span class="lbl">Voorkant · vraag of woord</span>
      <div id="mkimgprev"></div><textarea class="cardtxt" id="mkf" placeholder="Schrijf hier de vraag of het woord…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();mkFlip()}"></textarea></div>
    <div class="side back"><span class="lbl">Achterkant · antwoord</span>
      <textarea class="cardtxt" id="mkb" placeholder="Schrijf hier het antwoord…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();mkSave()}"></textarea></div>
  </div></div></div>
  <div id="mkbtns">${mkBtns()}</div>
  <input type="file" id="mkfile" accept="image/*" style="display:none" onchange="mkPhoto(this)">
  ${recent.length?`<h2>Laatst gemaakt</h2><div class="card" style="padding:6px 14px">${recent.map(c=>`<div class="kaart">${c.img?`<img class="thumb" src="${c.img}">`:""}<div class="f">${esc(c.f)}</div><div class="b">${esc(c.b)}</div><button onclick="cardForm('${v.id}','${d.id}','${c.id}')">✏️</button></div>`).join("")}</div>`:""}
  <button class="btn alt" onclick="bulkForm('${v.id}','${d.id}')">📋 Of plak een hele lijst tegelijk</button>`;
  setTimeout(()=>$("mkf")&&$("mkf").focus(),350);
}
function mkBtns(){
  return MK.side==="f"?`<div class="grid2"><button class="btn alt" onclick="$('mkfile').click()">📷 ${MK.img?"Andere foto":"Foto erbij"}</button><button class="btn" onclick="mkFlip()">Draai om ↻</button></div>`
  :`<div class="grid2"><button class="btn alt" onclick="mkFlip(true)">↺ Voorkant</button><button class="btn" style="background:#22a35a" onclick="mkSave()">✓ Opslaan</button></div>`;
}
function mkFlip(back){
  const fl=$("mk");
  if(back){MK.side="f";fl.classList.remove("on");$("mkbtns").innerHTML=mkBtns();setTimeout(()=>$("mkf").focus(),400);return}
  if(!$("mkf").value.trim()&&!MK.img){$("mkf").focus();fl.classList.remove("enter");void fl.offsetWidth;fl.classList.add("wiggle");return}
  MK.side="b";fl.classList.remove("enter");void fl.offsetWidth;fl.classList.add("on","lift");setTimeout(()=>fl.classList.remove("lift"),820);
  $("mkbtns").innerHTML=mkBtns();setTimeout(()=>$("mkb").focus(),450);
}
function mkSave(){
  const f=$("mkf").value.trim()||"(foto)",b=$("mkb").value.trim();if(!b){$("mkb").focus();return}
  const d=deck(vak(R.vid),R.did),c=mkCard(f,b);if(MK.img)c.img=MK.img;d.cards.push(c);save();
  const fl=$("mk");fl.classList.add("fly-r");
  const t=document.createElement("div");t.className="toast";t.textContent="✅ Kaart opgeslagen";document.body.appendChild(t);setTimeout(()=>t.remove(),1700);
  setTimeout(vMaker,380);
}
function mkPhoto(inp){
  const file=inp.files[0];if(!file)return;const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{const max=520,sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    MK.img=c.toDataURL("image/jpeg",.72);$("mkimgprev").innerHTML=im(MK.img);$("mkbtns").innerHTML=mkBtns()};img.src=e.target.result};
  r.readAsDataURL(file);inp.value="";
}

/* ===== BEGRIJPEND LEZEN ===== */
function vLezen(){
  const v=vak(R.vid);
  app.innerHTML=`<div class="topbar"><button class="x" onclick="go({v:'vak',vid:'${v.id}'})">‹ ${esc(v.name)}</button></div>
  <h1>📖 Begrijpend lezen</h1><p class="muted">Lees een tekst en beantwoord de vragen. Je krijgt bij elke vraag uitleg.</p>
  <div class="seg"><button class="${R.tab==="teksten"?"on":""}" onclick="go({v:'lezen',vid:'${v.id}',tab:'teksten'})">📄 Teksten</button><button class="${R.tab==="leerstof"?"on":""}" onclick="go({v:'lezen',vid:'${v.id}',tab:'leerstof'})">💡 Leerstof</button></div>
  ${R.tab==="teksten"?TEXTS.map(t=>{const b=S.lees[t.id];return`<div class="item" onclick="go({v:'tekst',vid:'${v.id}',id:'${t.id}'})"><div class="ico">${t.ico}</div><div class="grow"><b>${esc(t.title)}</b><br>
    <span class="tag">${t.soort}</span><span class="tag">${t.niveau}</span>${b!==undefined?`<span class="tag ${b===t.qs.length?"green":"blue"}">${b}/${t.qs.length}</span>`:""}</div></div>`}).join(""):
    LEARN.map(l=>`<details class="learn"><summary>${l.t}</summary><div class="body">${l.h}</div></details>`).join("")}`;
}
function textHtml(t){return`<h3>${esc(t.title)}</h3>`+t.paras.map((p,i)=>`<div class="para"><div class="nr">${i+1}</div><div>${esc(p)}</div></div>`).join("")}
function vTekst(){
  const t=TEXTS.find(x=>x.id===R.id);
  app.innerHTML=`<div class="topbar"><button class="x" onclick="go({v:'lezen',vid:'${R.vid}',tab:'teksten'})">‹ Teksten</button><span class="tag">${t.soort}</span></div>
  <h1>${t.ico} ${esc(t.title)}</h1>
  <div class="tipbox">👀 <b>Leestip:</b> lees eerst de titel, de eerste en de laatste alinea. Lees daarna de hele tekst rustig door.</div>
  <div class="card">${textHtml(t)}</div>
  <button class="btn" onclick="startLees('${t.id}')">Ik heb gelezen – start de ${t.qs.length} vragen</button>`;
}
let LQ=null;
function startLees(id){const t=TEXTS.find(x=>x.id===id);LQ={t,i:0,g:0,items:t.qs.map(q=>({...q,order:shuffle(q.o.map((_,i)=>i))}))};window.scrollTo(0,0);lqView()}
function lqView(){
  if(LQ.i>=LQ.items.length)return lqEnd();
  const q=LQ.items[LQ.i],sk=SKILLS[q.s];
  app.innerHTML=`<div class="topbar"><button class="x" onclick="go({v:'tekst',vid:'${R.vid}',id:'${LQ.t.id}'})">✕ Stoppen</button><span class="muted">Vraag ${LQ.i+1} van ${LQ.items.length}</span></div>
  <div class="pbar"><i style="width:${100*LQ.i/LQ.items.length}%"></i></div>
  <div class="row between" style="margin:10px 0 4px"><span class="tag blue">${sk.i} ${sk.n}</span><span><button class="btn small alt" onclick="lqText()">📄 Tekst</button> <button class="btn small alt" onclick="$('tip').style.display='block'">💡 Tip</button></span></div>
  <div class="tipbox" id="tip" style="display:none">💡 ${sk.tip}</div>
  <p style="font-size:18px;font-weight:700;margin:8px 0 14px">${esc(q.q)}</p>
  ${q.order.map(oi=>`<button class="opt" data-i="${oi}" onclick="lqA(${oi})">${esc(q.o[oi])}</button>`).join("")}<div id="fbk"></div>`;
}
function lqText(){sheet(`<div class="topbar"><b>📄 Tekst</b><button class="x" onclick="closeSheet()">Sluiten ✕</button></div>${textHtml(LQ.t)}<button class="btn" onclick="closeSheet()">Terug naar de vraag</button>`)}
function lqA(oi){
  if(LQ.lock)return;LQ.lock=true;const q=LQ.items[LQ.i],ok=oi===q.a;if(ok){LQ.g++;S.xp+=10}
  document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.a)b.classList.add("good");else if(i===oi)b.classList.add("bad")});
  $("fbk").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"✅ Goed! +10":"❌ Niet goed"}</b><p style="margin:6px 0 0">${esc(q.u)}</p></div><button class="btn" onclick="LQ.lock=false;LQ.i++;window.scrollTo(0,0);lqView()">${LQ.i+1<LQ.items.length?"Volgende vraag":"Bekijk resultaat"}</button>`;
  $("fbk").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function lqEnd(){
  const n=LQ.items.length;S.lees[LQ.t.id]=Math.max(S.lees[LQ.t.id]||0,LQ.g);markDay();save();
  app.innerHTML=`<div class="card center" style="margin-top:30px"><div class="muted">${esc(LQ.t.title)}</div><div class="big">${LQ.g}/${n}</div>
  <h3>${LQ.g===n?"Perfect! 🏆":LQ.g/n>=.7?"Goed gelezen! 💪":"Lees de uitleg nog eens rustig door 🔁"}</h3></div>
  <button class="btn" onclick="startLees('${LQ.t.id}')">Nog een keer</button><button class="btn alt" onclick="go({v:'lezen',vid:'${R.vid}',tab:'teksten'})">Andere tekst</button>`;
}

render();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
